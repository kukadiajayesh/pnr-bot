name: PNR Watch

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      pnr:
        description: "PNR number(s) to check (comma-separated, optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - env:
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY || vars.RAILRADAR_API_KEY || secrets.RAPID_KEY || vars.RAPID_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN || vars.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || vars.CHAT_ID }}
          PNR: ${{ inputs.pnr || secrets.PNR || vars.PNR || secrets.PNR_LIST || vars.PNR_LIST }}
        run: python check_pnr.py

      - run: |
          git config user.name pnr-bot
          git config user.email bot@users.noreply.github.com
          git add state.json
          git diff --staged --quiet || (git commit -m "Update state" && git pull --rebase && git push)
